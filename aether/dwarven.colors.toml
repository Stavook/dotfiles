# Dwarven palette, in Aether's colors.toml format.
# Import with: aether --import-colors-toml aether/dwarven.colors.toml
mode = "dark"

# UI Colors (extended)
accent = "#cc6633"
cursor = "#e8823d"

# Primary colors
foreground = "#e8e3d8"
background = "#141414"

# Selection colors
selection_foreground = "#141414"
selection_background = "#cc6633"

# Background shades
bg = "#141414"
lighter_bg = "#363431"
dark_bg = "#1a1a1a"
darker_bg = "#0e0e0e"

# Foreground shades
fg = "#e8e3d8"
light_fg = "#f4f0e8"
bright_fg = "#f4f0e8"
dark_fg = "#8a8578"
muted = "#4a4a4a"
selection = "#363431"

# Accent hues (semantic: red = error, orange = alert)
red = "#da4453"
green = "#a8a090"
yellow = "#d4a05c"
blue = "#8a8478"
magenta = "#b8825a"
cyan = "#9c9488"
orange = "#e8823d"
brown = "#b8825a"

# Bright hues
bright_red = "#e8823d"
bright_green = "#c4bcac"
bright_yellow = "#e8b878"
bright_blue = "#a49e92"
bright_magenta = "#d4986e"
bright_cyan = "#b8b0a4"

# Normal colors (ANSI 0-7)
color0 = "#141414"
color1 = "#cc6633"
color2 = "#a8a090"
color3 = "#d4a05c"
color4 = "#8a8478"
color5 = "#b8825a"
color6 = "#9c9488"
color7 = "#e8e3d8"

# Bright colors (ANSI 8-15)
color8 = "#4a4a4a"
