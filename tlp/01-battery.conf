# Drop-in override, merged over TLP's defaults (/etc/tlp.conf +
# /usr/share/tlp/defaults.conf). Kept as its own file rather than editing the
# main config, so it's obvious what's actually customized vs. stock.

# EPP hints: max performance on AC, toward efficiency on battery.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# ACPI platform profile (what power-profiles-daemon was also driving --
# TLP owns this now instead).
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# PCIe Active State Power Management -- lets idle PCIe devices (including
# the discrete GPU) drop into lower power states.
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

USB_AUTOSUSPEND=1

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

SOUND_POWER_SAVE_ON_BAT=1

# Not set: battery charge thresholds (START/STOP_CHARGE_THRESH_BAT0). This
# hardware's ideapad_laptop driver likely supports conservation-mode charge
# limits, but that changes day-to-day charging behavior -- worth deciding
# deliberately rather than defaulting silently.
