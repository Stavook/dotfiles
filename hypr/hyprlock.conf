$font = Hack Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(cc6633ee) rgba(e8823dee) 45deg
    check_color = rgba(e8823dee) rgba(cc6633ee) 120deg
    fail_color = rgba(da4453ee) rgba(da4453ee) 40deg

    font_color = rgb(232, 227, 216)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(232, 227, 216)

    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgb(232, 227, 216)

    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[us,gr]
    font_size = 24
    font_family = $font
    color = rgb(204, 102, 51)
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
