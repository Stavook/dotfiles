source = ~/.config/aether/theme/hyprlock.conf
source = ~/.config/hypr/hyprlock-wallpaper.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper

    # Dim and soften the wallpaper so the text stays readable on any image.
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = $fg

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000cc)

    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = $fg

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000cc)

    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 20
    font_family = $font
    color = $fg

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000cc)

    position = 0, 85
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    inner_color = $surface

    outer_color = $accent
    check_color = $alert
    fail_color = $error

    font_color = $fg
    fade_on_empty = false
    rounding = 6

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[us,gr]
    font_size = 14
    font_family = $font
    color = $fg
    onclick = hyprctl switchxkblayout all next

    position = 0, -15
    halign = center
    valign = center
}
